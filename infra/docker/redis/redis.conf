# Nexus-5v5 Redis configuration

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshots (backup)
save 900 1
save 300 10
save 60 10000

# Networking
bind 0.0.0.0
protected-mode no
tcp-keepalive 300

# Logging
loglevel notice
