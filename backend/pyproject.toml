[project]
name = "nexus"
version = "0.1.0"
description = "Nexus-5v5: AI-driven League of Legends Clash/5v5 analytics platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "RohanM023" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "polars>=1.15.0",
    "arq>=0.26.1",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "clickhouse-connect>=0.8.0",
    "websockets>=14.0",
    "cryptography>=44.0.0",
    "prometheus-client>=0.21.0",
    "discord.py>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0,<40.0.0",
    "aiosqlite>=0.20.0",
    "locust>=2.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A",
    "COM", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RSE",
    "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA",
]
ignore = [
    "ANN401",
    "S101",   # assert in tests is fine
    "COM812", # trailing comma conflicts with formatter
    "ISC001", # conflicts with formatter
    "B008",   # Depends() in function defaults is the standard FastAPI pattern
    "ARG001", # auth dependency args used for side effects (enforcing auth)
    "TC002", "TC003",  # moving imports to TYPE_CHECKING blocks is stylistic
    "S608",   # ClickHouse queries use string building with internal values
    "UP046",  # Generic[T] syntax is clearer than PEP 695 type parameters for now
]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
